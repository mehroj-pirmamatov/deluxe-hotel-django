{% extends "base.html" %}

{% load static%} {% block extra_css%}
  <link rel="stylesheet" href="{% static 'style/admin.css'%}" />
  <link rel="stylesheet" href="{% static 'style/footer.css'%}" />
{% endblock %}


{% block content %}


<div class="login-page">


  <main class="login-main">
    <div class="container">
      <form class="login-card" method="post">
        {% csrf_token %}
        <span class="login-badge"><i class="fa-solid fa-lock"></i> Admin panel</span>
        <h1>Admin Kirish</h1>
        <p>Hotel buyurtmalari, xonalar va mijozlar malumotlarini boshqarish uchun panelga kiring.</p>

        <div class="form-group">
          <label for="username">Login</label>
          <input id="username" name="username" type="text" placeholder="admin" required>
        </div>

        <div class="form-group">
          <label for="password">Parol</label>
          <input id="password" name="password" type="password" placeholder="admin123" required>
        </div>

        <button class="login-btn" type="submit">Dashboardga kirish</button>

        <a class="back-link" href="{% url 'index'%}"><i class="fa-solid fa-arrow-left"></i> Saytga qaytish</a>
      </form>
    </div>
  </main>
</div>
{%endblock%}
